<div class="pagination-container">
  <!-- Left Side: Total Records Info -->
  @if (showTotal) {
    <div class="pagination-info">
      @if (totalElements !== undefined) {
        <span class="total-text">Tổng số: <strong>{{ totalElements }}</strong> bản ghi</span>
      } @else if (totalPages > 0) {
        <span class="total-text">Trang <strong>{{ currentPage + 1 }}</strong> / <strong>{{ totalPages }}</strong></span>
      }
    </div>
  }

  <!-- Right Side: Controls (Limit options & Page buttons) -->
  <div class="pagination-controls">
    <!-- Page Size Changer Select -->
    @if (showSizeChanger && pageSizeOptions.length > 0) {
      <div class="page-size-selector">
        <label for="pageSizeSelect">Hiển thị:</label>
        <select
          id="pageSizeSelect"
          class="page-size-select"
          [ngModel]="pageSize"
          (change)="onPageSizeChange($event)">
          @for (option of pageSizeOptions; track option) {
            <option [value]="option">{{ option }} / trang</option>
          }
        </select>
      </div>
    }

    <!-- Pagination Buttons -->
    @if (totalPages > 0) {
      <div class="pagination-buttons">
        <button
          class="page-btn nav-btn"
          [disabled]="currentPage === 0"
          (click)="onPageChange(currentPage - 1)"
          title="Trang trước">
          &lt;
        </button>

        @for (page of getPageArray(); track page) {
          <button
            class="page-btn num-btn"
            [class.active]="page === currentPage"
            (click)="onPageChange(page)">
            {{ page + 1 }}
          </button>
        }

        <button
          class="page-btn nav-btn"
          [disabled]="currentPage === totalPages - 1 || totalPages === 0"
          (click)="onPageChange(currentPage + 1)"
          title="Trang sau">
          &gt;
        </button>
      </div>
    }
  </div>
</div>
